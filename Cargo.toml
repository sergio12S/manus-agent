[package]
name = "manus-agent-wallet"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE"
description = "A Solana wallet AI agents operate inside a human-set budget, with Touch ID approval above it."
homepage = "https://manuspay.xyz"
repository = "https://github.com/sergio12S/manus-agent"
readme = "README.md"
publish = false

[lib]
name = "manus_agent_wallet"
path = "src/lib.rs"

[[bin]]
name = "manus-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", features = ["json", "native-tls-vendored"] }
rustls = "0.23"
chrono = "0.4"
uuid = { version = "1.13", features = ["v4"] }
hex = "0.4"
base64 = "0.22.1"
bincode = "1.3.3"
sha2 = "0.10"
pbkdf2 = "0.12"
aes-gcm = "0.10"
rand = "0.8.5"
rpassword = "7.3"
zeroize = { version = "1.8", features = ["derive"] }
bip39 = "2.0"
solana-sdk = "2.1.0"
solana-client = "2.1.0"
solana-transaction-status = "2.1.0"
solana-account-decoder = "2.1.0"
solana-system-interface = { version = "1.0.0", features = ["serde", "bincode"] }
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "7.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
block2 = "0.6"

[profile.release]
opt-level = 3
codegen-units = 1
strip = true
